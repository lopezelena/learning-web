<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcance variables</title>
    <script>
        // Al declarar una variable con var, se puede redeclarar y reasignar su valor posteriormente de manera invisible para el usuario.
        var usuario = "Hermenegildo";
        var usuario = "Anacleto";
        console.log(usuario);
        // Si usamos let, no se puede redeclarar la variable dentro del mismo alcance, solo se puede reasignar su valor.
        let usuarioLet = "Hermenegildo";
        // let usuarioLet = "Anacleto"; // Esto generaría un error
        usuarioLet = "Gildo";
        console.log(usuarioLet);

        //Las variables declaradas con var tienen alcance de función, no de bloque. Por eso se puede acceder a 'price' fuera del if.
        var isAdult = true;

        if (isAdult) {
        var price = 100; 
        }
        console.log(price);

        //Lo correcto seria usar let o const para que la variable tenga alcance de bloque
        //Al usar let, la variable solo existe dentro del bloque if y no se puede acceder fuera de él.
        let priceLet;
        if (isAdult) {
            priceLet = 250;
        }
        console.log(priceLet);
    </script>
</head>
