<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
    <script>
        // Las variables son elementos que guardan los valores con los que trabajan los programas
        hours = 2.5;
        month = 10;
        name = "Ramiro";
        // Declarar una variable significa darle un nombre a un valor específico para poder usarlo posteriormente en el programa
        let year = 2026;
        let river = "Miño";
        const PI = 3.14159;
        
        // Podemos consultar el valor de una variable usando console.log
        console.log(hours);
        console.log(month);
        console.log(name);
        console.log(year);
        console.log(river);
        console.log(PI);

        // También podemos modificar el valor de una variable   
        hours = 3.5;
        month = 11;
        name = "Miro Pereira";
        year = 2027;
        river = "Sil";

        console.log(hours);
        console.log(month);
        console.log(name);
        console.log(year);
        console.log(river);
        console.log(PI);

        // También se puede declarar una variable con var, aunque su uso es menos recomendable en JavaScript moderno
        var city = "Madrid";
        console.log(city);

    </script>
</head>
<body>

</body>
</html>
