<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locales</title>
    <script>
        const date = new Date();
    </script>
</head>
<body>
    <nav><a href="../index.html">← Volver atrás</a><div>Pulsar F12 para abrir las herramientas de desarrollo</div></nav>
    <script>
        console.log(date);
        console.log(date.toLocaleString());
        console.log(date.toISOString());
        console.log(date.toLocaleDateString("es-ES"));
        console.log(date.toLocaleDateString("ar-EG")); //Egipto
        console.log(date.toLocaleDateString("es-MX")); //México
        console.log(date.getTime()); // Te lo da en la unidad de tiempo Unix, comprobar en un conversor online. 
    </script>
</body>
</html>
