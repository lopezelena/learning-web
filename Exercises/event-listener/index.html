<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event listener</title>
    <script>
        function addTask(){
            let input = document.getElementById("inputBox");
            let liVar = document.createElement("li");
            liVar.innerText = input.value;
            let buttonVar = document.createElement("button")
            buttonVar.innerText = "Borrar"
            buttonVar.addEventListener("click", (btn) => {
                btn.target.parentNode.remove();
            })
            liVar.appendChild(buttonVar);
            document.getElementById("task").appendChild(liVar);
            input.value = "";            
        }
        
    </script>
</head>
<body>
    <nav><a href="../index.html">← Volver atrás</a></nav>

    <input name="task" type="text" id="inputBox">
    <button onclick="addTask()">Añadir tarea</button>
    <ul id="task">
        
    </ul>
</body>
</html>
