<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getters y setters</title>
    <script>
        class Car{
            constructor(brand, model, speed){
                this.brand = brand;
                this.model = model;
                this.carSpeed = speed;
            }
            // Devuelve dato
            get actualSpeed(){
                return this.carSpeed;
            }
            get nextSpeed(){
                return this.carSpeed + 5;
            }
            // Establece dato "set"
            set speed(value){
                this.carSpeed = value;

            }
        }
    </script>
</head>
<body>
    <nav><a href="../index.html">← Volver atrás</a><div>Pulsar F12 para abrir las herramientas de desarrollo</div></nav>
    <script>
        let car = new Car();
        console.log(car.speed);
        car.speed = 25;
        console.log(car.speed);
    </script>
</body>
</html>
