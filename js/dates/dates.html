<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fechas</title>
    <script>
        let date = new Date();
        console.log(date);
        let customDate = new Date("2003-05-29"); //Pone más 2 porque lo compara con el GMT 0
        console.log(customDate);
        let fullDate = new Date(1990,11,20,18,0,3); //En este formato numero, sin comillas, los meses no van de 1 a 12 si no de 0 a 11. Por eso diciembre es mes 11.
        console.log(fullDate);
        console.log(fullDate.getDay()); //Devuelve el orden que ocupa día Jueves=4 de fullDate.
        console.log(fullDate.getDate());
        console.log(fullDate.toLocaleString());
    </script>
</head>
