<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucle for</title>
    <script>
        function functionFor(val){
            for(let i = 0; i < val; i++){
                console.log("Iteration " + i);
            }
        }
    </script>
</head>
<body>
    <nav><a href="../index.html">← Volver atrás</a><div>Pulsar F12 para abrir las herramientas de desarrollo</div></nav>
    <script>
        functionFor(5);
    </script>
</body>
</html>
